<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HØK — Heart of Khaos</title>
  <meta
    name="description"
    content="HØK — Heart of Khaos. Dark streetwear born from chaos."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --black: #050505;
      --black-2: #0b0b0b;
      --card: #101010;
      --white: #f4f4f4;
      --muted: #8a8a8a;
      --red: #9d0717;
      --red-bright: #c20d21;
      --border: rgba(255,255,255,.09);
      --max: 1280px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: "Inter", sans-serif;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    img {
      display: block;
      width: 100%;
    }

    /* =========================
       LOADER
    ========================= */

    .loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #050505;
      display: grid;
      place-items: center;
      transition: opacity .7s ease, visibility .7s ease;
    }

    .loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-inner {
      text-align: center;
    }

    .loader-logo {
      font-family: "Anton", sans-serif;
      font-size: clamp(4rem, 15vw, 9rem);
      letter-spacing: -4px;
      line-height: .8;
    }

    .loader-logo span {
      color: var(--red-bright);
    }

    .loader-line {
      width: 150px;
      height: 2px;
      background: #222;
      margin: 28px auto 0;
      overflow: hidden;
    }

    .loader-line::after {
      content: "";
      display: block;
      width: 50%;
      height: 100%;
      background: var(--red-bright);
      animation: load 1s infinite ease-in-out;
    }

    @keyframes load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      border-bottom: 1px solid transparent;
      transition: .3s ease;
    }

    header.scrolled {
      background: rgba(5,5,5,.88);
      backdrop-filter: blur(18px);
      border-color: var(--border);
    }

    .nav {
      width: min(var(--max), calc(100% - 40px));
      height: 82px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: "Anton", sans-serif;
      font-size: 2.1rem;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--red-bright);
    }

    .desktop-menu {
      display: flex;
      gap: 34px;
      align-items: center;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .desktop-menu a {
      position: relative;
      color: #d8d8d8;
      transition: .25s ease;
    }

    .desktop-menu a:hover {
      color: white;
    }

    .desktop-menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 0;
      height: 1px;
      background: var(--red-bright);
      transition: .25s ease;
    }

    .desktop-menu a:hover::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      background: transparent;
      border: 1px solid var(--border);
      color: white;
      border-radius: 50%;
      transition: .25s ease;
      position: relative;
    }

    .icon-btn:hover {
      border-color: var(--red-bright);
      transform: translateY(-2px);
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -2px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 20px;
      background: var(--red-bright);
      font-size: 9px;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .hamburger {
      display: none;
    }

    /* =========================
       MOBILE MENU
    ========================= */

    .mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(5,5,5,.98);
      transform: translateX(100%);
      transition: .45s cubic-bezier(.77,0,.18,1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mobile-menu.open {
      transform: translateX(0);
    }

    .mobile-links {
      display: flex;
      flex-direction: column;
      gap: 28px;
      text-align: center;
    }

    .mobile-links a {
      font-family: "Anton", sans-serif;
      font-size: 3rem;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .mobile-links a:hover {
      color: var(--red-bright);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 45%, rgba(157,7,23,.17), transparent 32%),
        radial-gradient(circle at 20% 80%, rgba(157,7,23,.08), transparent 28%),
        #050505;
    }

    .hero::before {
      content: "HØK";
      position: absolute;
      right: -30px;
      top: 50%;
      transform: translateY(-50%);
      font-family: "Anton", sans-serif;
      font-size: min(45vw, 650px);
      line-height: .7;
      color: rgba(255,255,255,.025);
      pointer-events: none;
    }

    .hero-content {
      width: min(var(--max), calc(100% - 40px));
      margin: auto;
      position: relative;
      z-index: 2;
      padding-top: 80px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: .22em;
      font-size: .7rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .eyebrow::before {
      content: "";
      width: 32px;
      height: 1px;
      background: var(--red-bright);
    }

    .hero h1 {
      font-family: "Anton", sans-serif;
      text-transform: uppercase;
      font-size: clamp(5rem, 14vw, 12rem);
      line-height: .79;
      letter-spacing: -.025em;
      max-width: 900px;
    }

    .hero h1 .red {
      color: var(--red-bright);
    }

    .hero-copy {
      max-width: 490px;
      color: #969696;
      line-height: 1.8;
      margin-top: 28px;
      font-size: .95rem;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      margin-top: 34px;
    }

    .btn {
      min-height: 52px;
      padding: 0 28px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
      letter-spacing: .13em;
      font-size: .72rem;
      font-weight: 900;
      transition: .25s ease;
    }

    .btn-primary {
      background: var(--red-bright);
      color: white;
    }

    .btn-primary:hover {
      background: #e0142d;
      transform: translateY(-3px);
    }

    .btn-outline {
      border: 1px solid #333;
      color: white;
    }

    .btn-outline:hover {
      border-color: #777;
      transform: translateY(-3px);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .6rem;
      text-transform: uppercase;
      letter-spacing: .25em;
      color: #666;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .scroll-indicator::after {
      content: "";
      width: 1px;
      height: 35px;
      background: linear-gradient(var(--red-bright), transparent);
    }

    /* =========================
       MARQUEE
    ========================= */

    .marquee {
      background: var(--red);
      overflow: hidden;
      padding: 13px 0;
      transform: rotate(-1deg) scale(1.03);
      position: relative;
      z-index: 5;
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 20s linear infinite;
    }

    .marquee span {
      font-family: "Anton", sans-serif;
      font-size: 1.4rem;
      letter-spacing: .08em;
      padding: 0 30px;
      white-space: nowrap;
    }

    .marquee span::before {
      content: "✦";
      margin-right: 30px;
    }

    @keyframes marquee {
      to {
        transform: translateX(-50%);
      }
    }

    /* =========================
       GENERAL SECTION
    ========================= */

    section {
      padding: 120px 0;
    }

    .container {
      width: min(var(--max), calc(100% - 40px));
      margin: auto;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 50px;
    }

    .section-title {
      font-family: "Anton", sans-serif;
      text-transform: uppercase;
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: .85;
    }

    .section-title span {
      color: var(--red-bright);
    }

    .section-subtitle {
      color: #777;
      max-width: 380px;
      line-height: 1.7;
      font-size: .88rem;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products {
      background: #080808;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .product {
      background: var(--card);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: .35s ease;
    }

    .product:hover {
      transform: translateY(-8px);
      border-color: rgba(194,13,33,.45);
    }

    .product-image {
      aspect-ratio: 1 / 1.15;
      background:
        radial-gradient(circle at 50% 40%, rgba(194,13,33,.15), transparent 40%),
        #111;
      overflow: hidden;
      position: relative;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .5s ease;
    }

    .product:hover .product-image img {
      transform: scale(1.05);
    }

    .product-placeholder {
      height: 100%;
      display: grid;
      place-items: center;
      color: #333;
      font-family: "Anton", sans-serif;
      font-size: 4rem;
    }

    .badge {
      position: absolute;
      left: 12px;
      top: 12px;
      background: var(--red-bright);
      color: white;
      padding: 6px 9px;
      font-size: .58rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .product-info {
      padding: 20px;
    }

    .product-category {
      color: #666;
      font-size: .62rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .product-name {
      font-family: "Anton", sans-serif;
      font-size: 1.55rem;
      text-transform: uppercase;
      margin: 6px 0 8px;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      color: #ddd;
      font-weight: 800;
      font-size: .9rem;
    }

    .add-cart {
      width: 38px;
      height: 38px;
      background: white;
      color: black;
      font-size: 1.1rem;
      transition: .25s ease;
    }

    .add-cart:hover {
      background: var(--red-bright);
      color: white;
    }

    /* =========================
       MANIFESTO
    ========================= */

    .manifesto {
      position: relative;
      overflow: hidden;
    }

    .manifesto::after {
      content: "KHAOS";
      position: absolute;
      right: -5%;
      bottom: -30px;
      font-family: "Anton", sans-serif;
      font-size: 22vw;
      line-height: .7;
      color: rgba(255,255,255,.025);
      pointer-events: none;
    }

    .manifesto-grid {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 80px;
      align-items: center;
    }

    .manifesto-label {
      color: var(--red-bright);
      text-transform: uppercase;
      letter-spacing: .2em;
      font-size: .65rem;
      font-weight: 900;
    }

    .manifesto h2 {
      font-family: "Anton", sans-serif;
      text-transform: uppercase;
      font-size: clamp(3.5rem, 8vw, 8rem);
      line-height: .82;
      margin-top: 15px;
    }

    .manifesto-text {
      color: #8a8a8a;
      line-height: 1.9;
      font-size: 1rem;
      max-width: 650px;
    }

    .manifesto-text strong {
      color: white;
    }

    /* =========================
       CATEGORIES
    ========================= */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .category {
      min-height: 380px;
      position: relative;
      overflow: hidden;
      background: #111;
      border: 1px solid var(--border);
      display: flex;
      align-items: end;
      padding: 30px;
    }

    .category::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 35%, rgba(194,13,33,.18), transparent 45%);
    }

    .category-content {
      position: relative;
      z-index: 2;
    }

    .category small {
      color: #888;
      text-transform: uppercase;
      letter-spacing: .2em;
      font-size: .62rem;
    }

    .category h3 {
      font-family: "Anton", sans-serif;
      font-size: 3.2rem;
      text-transform: uppercase;
      line-height: .9;
      margin-top: 7px;
    }

    .category-arrow {
      display: inline-block;
      margin-top: 22px;
      color: var(--red-bright);
      font-weight: 900;
    }

    /* =========================
       NEWSLETTER
    ========================= */

    .newsletter {
      background:
        linear-gradient(rgba(157,7,23,.88), rgba(157,7,23,.88)),
        #9d0717;
      text-align: center;
    }

    .newsletter h2 {
      font-family: "Anton", sans-serif;
      font-size: clamp(3.5rem, 8vw, 7rem);
      line-height: .85;
      text-transform: uppercase;
    }

    .newsletter p {
      max-width: 500px;
      margin: 22px auto;
      line-height: 1.7;
      color: rgba(255,255,255,.75);
    }

    .newsletter-form {
      max-width: 560px;
      margin: 30px auto 0;
      display: flex;
      gap: 8px;
    }

    .newsletter-form input {
      min-width: 0;
      flex: 1;
      height: 55px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.25);
      color: white;
      padding: 0 18px;
      outline: none;
    }

    .newsletter-form input::placeholder {
      color: rgba(255,255,255,.55);
    }

    .newsletter-form button {
      background: white;
      color: black;
      padding: 0 25px;
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 70px 0 25px;
      background: #030303;
    }

    .footer-top {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr 1fr;
      gap: 40px;
      padding-bottom: 60px;
      border-bottom: 1px solid var(--border);
    }

    .footer-logo {
      font-family: "Anton", sans-serif;
      font-size: 4rem;
      line-height: .8;
    }

    .footer-logo span {
      color: var(--red-bright);
    }

    .footer-description {
      color: #666;
      max-width: 300px;
      font-size: .8rem;
      line-height: 1.7;
      margin-top: 20px;
    }

    .footer-column h4 {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .2em;
      margin-bottom: 20px;
      color: #777;
    }

    .footer-column a {
      display: block;
      color: #aaa;
      font-size: .82rem;
      margin-bottom: 12px;
      transition: .2s;
    }

    .footer-column a:hover {
      color: var(--red-bright);
    }

    .footer-bottom {
      padding-top: 25px;
      display: flex;
      justify-content: space-between;
      color: #444;
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    /* =========================
       CART
    ========================= */

    .cart-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,.7);
      opacity: 0;
      visibility: hidden;
      transition: .3s ease;
    }

    .cart-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .cart {
      position: absolute;
      top: 0;
      right: 0;
      width: min(440px, 100%);
      height: 100%;
      background: #0a0a0a;
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: .4s cubic-bezier(.77,0,.18,1);
      display: flex;
      flex-direction: column;
    }

    .cart-overlay.open .cart {
      transform: translateX(0);
    }

    .cart-header {
      padding: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .cart-header h3 {
      font-family: "Anton", sans-serif;
      font-size: 2rem;
      text-transform: uppercase;
    }

    .close-cart {
      background: none;
      color: white;
      font-size: 1.5rem;
    }

    .cart-items {
      flex: 1;
      overflow: auto;
      padding: 20px;
    }

    .empty-cart {
      color: #555;
      text-align: center;
      margin-top: 80px;
      text-transform: uppercase;
      font-size: .7rem;
      letter-spacing: .15em;
    }

    .cart-item {
      display: flex;
      gap: 14px;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-img {
      width: 75px;
      height: 75px;
      object-fit: cover;
      background: #151515;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-info h4 {
      font-family: "Anton", sans-serif;
      text-transform: uppercase;
      font-size: 1.2rem;
    }

    .cart-item-info p {
      color: #777;
      font-size: .75rem;
      margin-top: 5px;
    }

    .remove-item {
      background: none;
      color: #555;
      font-size: .7rem;
      align-self: start;
    }

    .remove-item:hover {
      color: var(--red-bright);
    }

    .cart-footer {
      padding: 25px;
      border-top: 1px solid var(--border);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .checkout {
      width: 100%;
      height: 54px;
      background: var(--red-bright);
      color: white;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 5000;
      transform: translate(-50%, 120px);
      background: white;
      color: black;
      padding: 14px 20px;
      font-size: .72rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      transition: .35s ease;
    }

    .toast.show {
      transform: translate(-50%, 0);
    }

    /* =========================
       REVEAL
    ========================= */

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: .8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transf
